name: CI/CD - ClickMarket Billing Service

on:
  push:
    branches: [ main ]
    paths:
      - "billing_Service/**"
      - ".github/workflows/billing_Service.yml"

  pull_request:
    branches: [ main ]
    paths:
      - "billing_Service/**"
      - ".github/workflows/billing_Service.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing_Service

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y construir servicio
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: billing_Service

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas automatizadas
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: billing_Service

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Crear imagen del servicio
        run: |
          echo "Construyendo imagen de Billing Service..."
          docker build -t clickmarket/billing-service:${{ github.sha }} .

      - name: Simular despliegue Blue-Green
        run: |
          echo "=== BLUE-GREEN DEPLOYMENT ==="
          echo "Versión actual (BLUE): billing-service:stable"
          echo "Nueva versión (GREEN): billing-service:${{ github.sha }}"
          echo "Desplegando nueva versión en entorno GREEN..."
          echo "Ejecutando health check..."
          echo "Health check exitoso."
          echo "Cambiando tráfico de BLUE a GREEN..."
          echo "Billing Service desplegado correctamente."

      - name: Simular rollback
        if: failure()
        run: |
          echo "ERROR: El despliegue de Billing Service falló."
          echo "Ejecutando rollback..."
          echo "Restaurando versión BLUE..."
          echo "Rollback completado."
