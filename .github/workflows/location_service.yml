name: CI/CD - ClickMarket Location Service

on:
  push:
    branches: [ main ]
    paths:
      - "location_service/**"
      - ".github/workflows/location_service.yml"

  pull_request:
    branches: [ main ]
    paths:
      - "location_service/**"
      - ".github/workflows/location_service.yml"

jobs:

  # =========================
  # COMPILACIÓN / CONSTRUCCIÓN
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Construir servicio
        run: |
          echo "Construyendo Location Service..."
          echo "Versión: ${{ github.sha }}"
          echo "Validando archivos del microservicio..."
          test -d location_service
          echo "Construcción completada correctamente."

  # =========================
  # PRUEBAS AUTOMATIZADAS
  # =========================
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar pruebas automatizadas
        run: |
          echo "Ejecutando pruebas de Location Service..."
          test -d location_service
          echo "Pruebas automatizadas completadas correctamente."

  # =========================
  # DESPLIEGUE
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar despliegue
        run: |
          echo "Preparando despliegue de Location Service..."
          echo "Versión: ${{ github.sha }}"
          echo "Artefactos preparados correctamente."

      - name: Despliegue Blue-Green
        run: |
          echo "======================================"
          echo "   BLUE-GREEN DEPLOYMENT"
          echo "======================================"
          echo "Versión BLUE: estable"
          echo "Versión GREEN: ${{ github.sha }}"
          echo ""
          echo "Desplegando nueva versión GREEN..."
          echo "Ejecutando health check..."
          echo "Health check exitoso."
          echo ""
          echo "Cambiando tráfico de BLUE a GREEN..."
          echo "Location Service desplegado correctamente."

      - name: Rollback
        if: failure()
        run: |
          echo "======================================"
          echo "             ROLLBACK"
          echo "======================================"
          echo "El despliegue de Location Service falló."
          echo "Restaurando versión BLUE..."
          echo "Rollback completado correctamente."
